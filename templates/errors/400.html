{% extends 'base.html' %}

{% block title %}Solicitud inválida — Vet en un Click{% endblock %}

{% block content %}
<div class="card error-page">
  <svg class="i" aria-hidden="true" style="width:56px;height:56px;color:var(--brand)"><use href="#alert"/></svg>
  <span class="error-code">400</span>
  <h1>Solicitud inválida</h1>
  <p>La sesión expiró o el formulario no es válido. Recarga la página e inténtalo de nuevo.</p>
  <div class="actions">
    <a class="btn" href="{{ url_for('index') }}">
      <svg class="i" aria-hidden="true"><use href="#arrow-left"/></svg>
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
