{% extends 'base.html' %}

{% block title %}Archivo demasiado grande — Vet en un Click{% endblock %}

{% block content %}
<div class="card error-page">
  <svg class="i" aria-hidden="true" style="width:56px;height:56px;color:var(--brand)"><use href="#clip"/></svg>
  <span class="error-code">413</span>
  <h1>Archivo demasiado grande</h1>
  <p>El archivo que intentaste subir supera el límite de 16 MB.</p>
  <p class="hint">Intenta con una imagen o video más pequeño.</p>
  <div class="actions">
    <a class="btn" href="{{ url_for('triaje.lista') }}">
      <svg class="i" aria-hidden="true"><use href="#arrow-left"/></svg>
      Volver a mis consultas
    </a>
  </div>
</div>
{% endblock %}
