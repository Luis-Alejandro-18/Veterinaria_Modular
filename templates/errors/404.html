{% extends 'base.html' %}

{% block title %}Página no encontrada — Vet en un Click{% endblock %}

{% block content %}
<div class="card error-page">
  <svg class="i" aria-hidden="true" style="width:56px;height:56px;color:var(--brand)"><use href="#search"/></svg>
  <span class="error-code">404</span>
  <h1>Página no encontrada</h1>
  <p>La página que buscas no existe o fue movida.</p>
  <div class="actions">
    <a class="btn" href="{{ url_for('index') }}">
      <svg class="i" aria-hidden="true"><use href="#arrow-left"/></svg>
      Volver al inicio
    </a>
    <a class="btn ghost" href="{{ url_for('mapa.mapa') }}">
      <svg class="i" aria-hidden="true"><use href="#pin"/></svg>
      Ver el mapa
    </a>
  </div>
</div>
{% endblock %}
