{% extends 'base.html' %}

{% block title %}Nuevo triaje — Veterinaria Modular{% endblock %}

{% block content %}
<h1>Nuevo triaje</h1>

{% if mascotas %}
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Mascota
    <select name="mascota_id" required>
      <option value="">Selecciona una mascota</option>
      {% for mascota in mascotas %}
        <option value="{{ mascota.id }}">{{ mascota.nombre }} ({{ mascota.especie }})</option>
      {% endfor %}
    </select>
  </label>

  <label>Describe los síntomas
    <textarea name="sintomas" rows="5" required placeholder="Ej: mi perro vomita y tiene fiebre desde ayer..."></textarea>
  </label>

  <label class="checkbox">
    <input type="checkbox" name="acepta_terminos_triage" required>
    Acepto que esta orientación es un triaje preliminar y no sustituye un diagnóstico veterinario.
  </label>

  <button type="submit" class="btn btn-primary">Enviar consulta</button>
</form>
{% else %}
<p>Primero registra una mascota para poder iniciar un triaje.</p>
<a class="btn btn-primary" href="{{ url_for('mascotas.nueva') }}">+ Nueva mascota</a>
{% endif %}
{% endblock %}
