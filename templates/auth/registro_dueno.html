{% extends 'base.html' %}

{% block title %}Registro de Dueño — Vet en un Click{% endblock %}

{% block content %}
<div class="card auth-card">
  <div class="page-head">
    <svg class="i" aria-hidden="true"><use href="#user"/></svg>
    <div>
      <h1>Registro — Dueño de mascota</h1>
      <p>Registra tus datos para reportar casos y dar seguimiento a tus consultas.</p>
    </div>
  </div>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="nombre">Nombre</label>
      <input class="in" id="nombre" type="text" name="nombre" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input class="in" id="email" type="email" name="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input class="in" id="password" type="password" name="password" autocomplete="new-password" minlength="6" required>
      <small class="hint">Mínimo 6 caracteres.</small>
    </div>

    <div class="actions">
      <button type="submit" class="btn">Registrarme como dueño</button>
    </div>
  </form>

  <p class="hint">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>.</p>
</div>
{% endblock %}
