{% extends 'base.html' %}

{% block title %}Registro — Veterinaria Modular{% endblock %}

{% block content %}
<h1>Crear cuenta</h1>

<form method="post" class="form">
  <label>Nombre
    <input type="text" name="nombre" required>
  </label>

  <label>Email
    <input type="email" name="email" required>
  </label>

  <label>Contraseña
    <input type="password" name="password" required minlength="6">
  </label>

  <label>Rol
    <select name="rol">
      <option value="dueno">Dueño de mascota</option>
      <option value="veterinario">Veterinario</option>
    </select>
  </label>

  <label>Cédula profesional (solo veterinarios)
    <input type="text" name="cedula_profesional">
  </label>

  <button type="submit" class="btn btn-primary">Registrarme</button>
</form>

<p>¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>.</p>
{% endblock %}
