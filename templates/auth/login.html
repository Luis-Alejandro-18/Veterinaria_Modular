{% extends 'base.html' %}

{% block title %}Iniciar sesión — Vet en un Click{% endblock %}

{% block content %}
<div class="card auth-card">
  <div class="page-head">
    <svg class="i" aria-hidden="true"><use href="#user"/></svg>
    <div>
      <h1>Iniciar sesión</h1>
      <p>Accede para gestionar tus mascotas y consultas.</p>
    </div>
  </div>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="email">Email</label>
      <input class="in" id="email" type="email" name="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input class="in" id="password" type="password" name="password" autocomplete="current-password" required>
    </div>

    <div class="actions">
      <button type="submit" class="btn">Entrar</button>
    </div>
  </form>

  <p class="hint">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a>.</p>
</div>
{% endblock %}
